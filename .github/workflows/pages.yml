name: Deploy Binahayat Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'content/**'
      - 'scripts/**'
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and check the website
        run: |
          node scripts/build.mjs
          node scripts/validate.mjs
      - name: Prepare URLs for the repository site
        run: node scripts/prepare-pages.mjs
        env:
          BUILD_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload the website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
